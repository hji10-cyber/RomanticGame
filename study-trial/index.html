<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Practice Task</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

       #game {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;
    background: black;
}

        /* Two video layers */

        .storyVideo {
            position: absolute;
            inset: 0;
            z-index: 1;

            width: 100%;
            height: 100%;

            object-fit: contain;
            background: #000;

            opacity: 0;
            visibility: hidden;
        }

        .storyVideo.active {
            z-index: 2;
            opacity: 1;
            visibility: visible;
        }

        /* Introduction screen */

        #introScreen {
            position: absolute;
            inset: 0;
            z-index: 30;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 36px;

            background: #000;
            color: #fff;
            text-align: center;

            opacity: 1;
            transition: opacity 0.4s ease;
        }

        #introScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #introContent {
            display: flex;
            flex-direction: column;
            align-items: center;

            width: 100%;
            max-width: 620px;

            gap: 30px;
        }

        #introText {
            width: 100%;
            margin: 0;

            color: #fff;

            font-size: clamp(20px, 4.5vw, 26px);
            font-weight: 400;
            line-height: 1.5;

            opacity: 0;
            transform: translateY(12px);

            animation:
                introFadeIn 1.5s ease-out 0.2s forwards;
        }

        @keyframes introFadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Begin button */

        #beginButton {
            padding: 14px 38px;

            border: none;
            border-radius: 30px;

            background: #fff;
            color: #000;

            font-family: inherit;
            font-size: 18px;

            cursor: pointer;

            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);

            transition:
                opacity 0.6s ease,
                transform 0.6s ease,
                background 0.2s ease;
        }

        #beginButton.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        #beginButton:hover {
            background: #e8e8e8;
        }

        #beginButton:disabled {
            cursor: default;
            opacity: 0.65;
        }

        /* Invisible click area */

        #clickScreen {
            position: absolute;
            inset: 0;
            z-index: 20;

            display: none;

            background: transparent;
            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        #clickScreen.enabled {
            display: block;
        }

        /* Black screen while Qualtrics advances */

        #endingScreen {
            position: absolute;
            inset: 0;
            z-index: 40;

            display: none;
            background: #000;
        }
    </style>
</head>

<body>
    <main id="game">
        <video
            id="videoA"
            class="storyVideo"
            preload="auto"
            playsinline
        ></video>

        <video
            id="videoB"
            class="storyVideo"
            preload="auto"
            playsinline
        ></video>

        <div
            id="clickScreen"
            role="button"
            aria-label="Continue the practice task"
            tabindex="0"
        ></div>

        <section id="introScreen">
            <div id="introContent">
                <p id="introText">
                    When you see a visual cue to interact,
                    click anywhere on the screen.
                </p>

                <button
                    id="beginButton"
                    type="button"
                >
                    Begin
                </button>
            </div>
        </section>

        <div id="endingScreen"></div>
    </main>

    <script>
        const videos = [
            "../assets/trial-task/trial task 1.mp4",
            "../assets/trial-task/trial task 2.mp4",
            "../assets/trial-task/trial task 3.mp4",
            "../assets/trial-task/trial task 4.mp4"
        ];

        const videoA =
            document.getElementById("videoA");

        const videoB =
            document.getElementById("videoB");

        const introScreen =
            document.getElementById("introScreen");

        const beginButton =
            document.getElementById("beginButton");

        const clickScreen =
            document.getElementById("clickScreen");

        const endingScreen =
            document.getElementById("endingScreen");

        let activeVideo = videoA;
        let standbyVideo = videoB;

        let currentVideo = 0;
        let waitingForClick = false;
        let switchingVideo = false;
        let practiceFinished = false;

        /*
        Load a video into one of the two video layers.
        */

        function prepareVideo(
            videoElement,
            videoIndex
        ) {
            videoElement.pause();
            videoElement.classList.remove("active");

            if (videoIndex >= videos.length) {
                videoElement.removeAttribute("src");
                videoElement.load();
                return;
            }

            videoElement.src = videos[videoIndex];
            videoElement.preload = "auto";
            videoElement.load();
        }

        /*
        Wait until the video can play.
        */

        function waitUntilPlayable(videoElement) {
            return new Promise(function (resolve) {
                if (videoElement.readyState >= 3) {
                    resolve();
                    return;
                }

                const handleReady = function () {
                    videoElement.removeEventListener(
                        "canplay",
                        handleReady
                    );

                    resolve();
                };

                videoElement.addEventListener(
                    "canplay",
                    handleReady,
                    { once: true }
                );
            });
        }

        /*
        Initial preload.
        */

        prepareVideo(videoA, 0);
        prepareVideo(videoB, 1);

        /*
        Show the Begin button after three seconds.
        */

        window.setTimeout(function () {
            beginButton.classList.add("visible");
        }, 3000);

        /*
        Begin the practice task.
        */

        beginButton.addEventListener(
            "click",
            async function () {
                if (
                    beginButton.disabled ||
                    switchingVideo
                ) {
                    return;
                }

                beginButton.disabled = true;
                switchingVideo = true;
                currentVideo = 0;

                try {
                    await waitUntilPlayable(activeVideo);

                    activeVideo.currentTime = 0;
                    await activeVideo.play();

                    activeVideo.classList.add("active");
                    introScreen.classList.add("hidden");

                    window.setTimeout(function () {
                        introScreen.style.display = "none";
                    }, 400);
                } catch (error) {
                    console.error(
                        "The first practice video could not play:",
                        error
                    );

                    beginButton.disabled = false;
                } finally {
                    switchingVideo = false;
                }
            }
        );

        /*
        A video has ended.
        */

        function handleVideoEnded(event) {
            if (
                event.currentTarget !== activeVideo ||
                practiceFinished
            ) {
                return;
            }

            /*
            The fourth and final video advances
            automatically without another click.
            */

            if (
                currentVideo ===
                videos.length - 1
            ) {
                finishPractice();
                return;
            }

            /*
            After videos 1–3, wait for a click.
            */

            waitingForClick = true;
            clickScreen.classList.add("enabled");

            console.log(
                "Waiting for a click after:",
                videos[currentVideo]
            );
        }

        videoA.addEventListener(
            "ended",
            handleVideoEnded
        );

        videoB.addEventListener(
            "ended",
            handleVideoEnded
        );

        /*
        Play the next video after a click.
        */

        async function continuePractice() {
            if (
                !waitingForClick ||
                switchingVideo ||
                practiceFinished
            ) {
                return;
            }

            waitingForClick = false;
            switchingVideo = true;

            clickScreen.classList.remove("enabled");

            const nextVideoIndex =
                currentVideo + 1;

            try {
                await waitUntilPlayable(standbyVideo);

                standbyVideo.currentTime = 0;
                await standbyVideo.play();

                /*
                Show the incoming video only after
                it has successfully started.
                */

                standbyVideo.classList.add("active");
                activeVideo.classList.remove("active");

                activeVideo.pause();
                activeVideo.removeAttribute("src");
                activeVideo.load();

                const previousVideo = activeVideo;

                activeVideo = standbyVideo;
                standbyVideo = previousVideo;

                currentVideo = nextVideoIndex;

                /*
                Preload the following video.
                */

                prepareVideo(
                    standbyVideo,
                    currentVideo + 1
                );
            } catch (error) {
                console.error(
                    "The next practice video could not play:",
                    error
                );

                waitingForClick = true;
                clickScreen.classList.add("enabled");
            } finally {
                switchingVideo = false;
            }
        }

        clickScreen.addEventListener(
            "click",
            continuePractice
        );

        clickScreen.addEventListener(
            "keydown",
            function (event) {
                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {
                    event.preventDefault();
                    continuePractice();
                }
            }
        );

        /*
        Finish the practice task and notify Qualtrics.
        */

        function finishPractice() {
            if (practiceFinished) {
                return;
            }

            practiceFinished = true;
            waitingForClick = false;

            videoA.pause();
            videoB.pause();

            videoA.classList.remove("active");
            videoB.classList.remove("active");

            clickScreen.classList.remove("enabled");
            introScreen.style.display = "none";
            endingScreen.style.display = "block";

            window.parent.postMessage(
                {
                    type: "otome-study-complete",
                    study: "trial-task"
                },
                "*"
            );
        }
    </script>
</body>
</html>
