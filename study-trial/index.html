<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Practice Task</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;
            font-family: Arial, sans-serif;
        }

        #game {
            position: relative;

            width: 430px;
            height: 760px;

            max-width: 100vw;
            max-height: 100vh;

            overflow: hidden;
            background: black;
        }

        /* Two video layers reduce black flashes */

        .storyVideo {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;
            background: black;

            opacity: 0;
            z-index: 1;

            transition: none;
        }

        #videoA {
            opacity: 1;
            z-index: 2;
        }

        /* Introduction */

        #introScreen {
            position: absolute;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 36px;

            background: black;
            color: white;

            z-index: 30;

            opacity: 1;
            transition: opacity 0.4s ease;
        }

        #introScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #introContent {
            width: 100%;
            max-width: 620px;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 30px;
        }

        #introText {
            width: 100%;
            margin: 0;

            color: white;

            font-size: clamp(20px, 2.2vw, 26px);
            line-height: 1.5;
            font-weight: 400;

            text-align: center;

            opacity: 0;
            transform: translateY(12px);

            animation:
                introFadeIn 1.5s ease-out 0.2s forwards;
        }

        @keyframes introFadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Begin button */

        #beginButton {
            padding: 14px 38px;

            border: none;
            border-radius: 30px;

            background: white;
            color: black;

            font-family: inherit;
            font-size: 18px;

            cursor: pointer;

            opacity: 0;
            transform: translateY(8px);

            pointer-events: none;

            transition:
                opacity 0.6s ease,
                transform 0.6s ease,
                background 0.2s ease;
        }

        #beginButton.visible {
            opacity: 1;
            transform: translateY(0);

            pointer-events: auto;
        }

        #beginButton:hover {
            background: #e8e8e8;
        }

        #beginButton:disabled {
            cursor: default;
        }

        /* Invisible click area */

        #clickScreen {
            position: absolute;
            inset: 0;

            display: none;

            background: transparent;
            cursor: pointer;

            z-index: 20;
        }

        /* Black screen while Qualtrics advances */

        #endingScreen {
            position: absolute;
            inset: 0;

            display: none;

            background: black;
            z-index: 40;
        }
    </style>
</head>

<body>

    <div id="game">

        <video
            id="videoA"
            class="storyVideo"
            playsinline
            preload="auto"
        ></video>

        <video
            id="videoB"
            class="storyVideo"
            playsinline
            preload="auto"
        ></video>

        <!-- Becomes clickable when a clip ends -->

        <div id="clickScreen"></div>

        <!-- Practice instruction -->

        <div id="introScreen">

            <div id="introContent">

                <p id="introText">
                    When you see a visual cue to interact,
                    click on the screen.
                </p>

                <button
                    id="beginButton"
                    type="button"
                    disabled
                >
                    Begin
                </button>

            </div>

        </div>

        <div id="endingScreen"></div>

    </div>

    <script>
        /* ==========================================
           PRACTICE VIDEO LIST
        ========================================== */

        const videos = [
            "../assets/trial-task/trial task 1.mp4",
            "../assets/trial-task/trial task 2.mp4",
            "../assets/trial-task/trial task 3.mp4",
            "../assets/trial-task/trial task 4.mp4"
        ];

        let currentVideo = 0;
        let clickStartTime = 0;
        let practiceFinished = false;
        let switchingVideo = false;

        const clickData = [];

        /* ==========================================
           PAGE ELEMENTS
        ========================================== */

        const game =
            document.getElementById("game");

        const videoA =
            document.getElementById("videoA");

        const videoB =
            document.getElementById("videoB");

        const clickScreen =
            document.getElementById("clickScreen");

        const introScreen =
            document.getElementById("introScreen");

        const beginButton =
            document.getElementById("beginButton");

        const endingScreen =
            document.getElementById("endingScreen");

        let activeVideo = videoA;
        let standbyVideo = videoB;

        /* ==========================================
           INITIAL PRELOAD
        ========================================== */

        preloadVideo(activeVideo, 0);
        preloadVideo(standbyVideo, 1);

        activeVideo.style.opacity = "1";
        activeVideo.style.zIndex = "2";

        /*
        Show Begin after three seconds.
        */

        setTimeout(function () {
            beginButton.disabled = false;
            beginButton.classList.add("visible");
        }, 3000);

        /* ==========================================
           PRELOAD VIDEO
        ========================================== */

        function preloadVideo(
            videoElement,
            videoIndex
        ) {
            videoElement.pause();

            videoElement.style.opacity = "0";
            videoElement.style.zIndex = "1";

            if (videoIndex >= videos.length) {
                videoElement.removeAttribute("src");
                videoElement.load();
                return;
            }

            videoElement.src = videos[videoIndex];
            videoElement.preload = "auto";
            videoElement.load();
        }

        /* ==========================================
           WAIT FOR A REAL VIDEO FRAME
        ========================================== */

        function afterVideoFrame(
            videoElement,
            callback
        ) {
            if (
                typeof videoElement
                    .requestVideoFrameCallback
                === "function"
            ) {
                videoElement.requestVideoFrameCallback(
                    callback
                );
            } else {
                videoElement.addEventListener(
                    "playing",
                    function () {
                        requestAnimationFrame(
                            function () {
                                requestAnimationFrame(
                                    callback
                                );
                            }
                        );
                    },
                    { once: true }
                );
            }
        }

        /* ==========================================
           BEGIN PRACTICE
        ========================================== */

        beginButton.addEventListener(
            "click",
            function () {
                if (beginButton.disabled) {
                    return;
                }

                beginButton.disabled = true;

                currentVideo = 0;
                clickData.length = 0;

                playFirstVideo();
            }
        );

        /* ==========================================
           PLAY FIRST VIDEO
        ========================================== */

        function playFirstVideo() {
            activeVideo.currentTime = 0;

            /*
            Keep the instruction visible until
            the first frame is ready.
            */

            afterVideoFrame(
                activeVideo,
                function () {
                    activeVideo.style.opacity = "1";
                    activeVideo.style.zIndex = "2";

                    introScreen.classList.add("hidden");

                    setTimeout(function () {
                        introScreen.style.display = "none";
                    }, 400);
                }
            );

            activeVideo.play()
                .then(function () {
                    console.log(
                        "Playing practice clip:",
                        videos[currentVideo]
                    );
                })
                .catch(function (error) {
                    showPlaybackError(error);
                });
        }

        /* ==========================================
           PLAY NEXT VIDEO
        ========================================== */

        function playPreloadedVideo() {
            const outgoingVideo =
                activeVideo;

            const incomingVideo =
                standbyVideo;

            let hasSwitched = false;

            incomingVideo.currentTime = 0;

            function switchToIncomingVideo() {
                if (hasSwitched) {
                    return;
                }

                hasSwitched = true;

                incomingVideo.style.zIndex = "3";
                incomingVideo.style.opacity = "1";

                outgoingVideo.style.opacity = "0";
                outgoingVideo.style.zIndex = "1";

                activeVideo = incomingVideo;
                standbyVideo = outgoingVideo;

                activeVideo.style.opacity = "1";
                activeVideo.style.zIndex = "2";

                switchingVideo = false;

                preloadVideo(
                    standbyVideo,
                    currentVideo + 1
                );
            }

            afterVideoFrame(
                incomingVideo,
                switchToIncomingVideo
            );

            incomingVideo.play()
                .then(function () {
                    console.log(
                        "Playing practice clip:",
                        videos[currentVideo]
                    );
                })
                .catch(function (error) {
                    switchingVideo = false;
                    showPlaybackError(error);
                });
        }

        /* ==========================================
           VISUAL CUE READY
        ========================================== */

        function handleVideoEnded(event) {
            if (
                event.currentTarget !== activeVideo
            ) {
                return;
            }

            /*
            The final frame remains visible.
            The participant can now click anywhere.
            */

            clickStartTime =
                performance.now();

            clickScreen.style.display = "block";

            console.log(
                "Waiting for practice click after:",
                videos[currentVideo]
            );
        }

        videoA.addEventListener(
            "ended",
            handleVideoEnded
        );

        videoB.addEventListener(
            "ended",
            handleVideoEnded
        );

        /* ==========================================
           CLICK TO INTERACT
        ========================================== */

        clickScreen.addEventListener(
            "click",
            function (event) {
                if (switchingVideo) {
                    return;
                }

                const reactionTime =
                    performance.now() -
                    clickStartTime;

                const gameRect =
                    game.getBoundingClientRect();

                clickData.push({
                    practiceInteraction:
                        currentVideo + 1,

                    video:
                        videos[currentVideo],

                    reactionTime:
                        Math.round(reactionTime),

                    clickX:
                        Math.round(
                            event.clientX -
                            gameRect.left
                        ),

                    clickY:
                        Math.round(
                            event.clientY -
                            gameRect.top
                        )
                });

                clickScreen.style.display = "none";

                /*
                After the fourth successful click,
                finish the practice task.
                */

                if (
                    currentVideo ===
                    videos.length - 1
                ) {
                    finishPractice();
                    return;
                }

                switchingVideo = true;
                currentVideo++;

                playPreloadedVideo();
            }
        );

        /* ==========================================
           PLAYBACK ERROR
        ========================================== */

        function showPlaybackError(error) {
            console.error(
                "Practice playback error:",
                error
            );

            alert(
                "Could not play this video:\n" +
                videos[currentVideo]
            );
        }

        /* ==========================================
           FINISH AND NOTIFY QUALTRICS
        ========================================== */

        function finishPractice() {
            if (practiceFinished) {
                return;
            }

            practiceFinished = true;

            videoA.pause();
            videoB.pause();

            videoA.style.opacity = "0";
            videoB.style.opacity = "0";

            clickScreen.style.display = "none";
            introScreen.style.display = "none";
            endingScreen.style.display = "block";

            console.log(
                "PRACTICE TASK COMPLETE"
            );

            console.table(clickData);

            if (window.parent !== window) {
                window.parent.postMessage(
                    {
                        type: "otome-study-complete",
                        study: "trial-task"
                    },
                    "*"
                );
            }
        }
    </script>

</body>

</html>
