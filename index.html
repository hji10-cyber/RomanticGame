<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Caleb Birthday Study</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;
            font-family: Arial, sans-serif;
        }

        #game {
            position: relative;

            width: 430px;
            height: 760px;

            max-width: 100vw;
            max-height: 100vh;

            overflow: hidden;
            background: black;
        }

        /*
         * Two video elements are used.
         * One plays while the other preloads the next scene.
         */

        .storyVideo {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;
            background: black;

            opacity: 0;

            transition:
                opacity 180ms ease;

            z-index: 1;
        }

        #videoA {
            opacity: 1;
        }

        /* Begin screen */

        #startScreen {
            position: absolute;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            background: black;

            z-index: 30;
        }

        #startButton {
            padding: 15px 35px;

            border: none;
            border-radius: 30px;

            background: white;
            color: black;

            font-size: 18px;
            cursor: pointer;
        }

        #startButton:hover {
            background: #e8e8e8;
        }

        /* Five-second introduction */

        #introScreen {
            position: absolute;
            inset: 0;

            display: none;
            justify-content: center;
            align-items: center;

            padding: 40px;

            background: black;
            color: white;

            text-align: center;
            font-size: 20px;
            line-height: 1.6;

            z-index: 25;
        }

        #introScreen p {
            max-width: 350px;
            margin: 0;

            opacity: 0;

            animation:
                introFadeIn 1.5s ease-out 0.2s forwards;
        }

        @keyframes introFadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /*
         * Transparent click area.
         * Enabled after videos 1–7 finish.
         */

        #clickScreen {
            position: absolute;
            inset: 0;

            display: none;

            background: transparent;
            cursor: pointer;

            z-index: 15;
        }

        /* Completion screen */

        #finishScreen {
            position: absolute;
            inset: 0;

            display: none;
            justify-content: center;
            align-items: center;

            background: black;
            color: white;

            font-size: 20px;
            text-align: center;

            z-index: 40;
        }
    </style>
</head>

<body>
    <div id="game">

        <!-- Two alternating video players -->

        <video
            id="videoA"
            class="storyVideo"
            playsinline
            preload="auto">
        </video>

        <video
            id="videoB"
            class="storyVideo"
            playsinline
            preload="auto">
        </video>

        <!-- Click anywhere to continue -->

        <div id="clickScreen"></div>

        <!-- Introduction -->

        <div id="introScreen">
            <p>
                It’s Caleb’s birthday. After watching a movie
                together, you have prepared a small gift for him.
            </p>
        </div>

        <!-- Start screen -->

        <div id="startScreen">
            <button id="startButton" type="button">
                Begin
            </button>
        </div>

        <!-- Completion screen -->

        <div id="finishScreen">
            Story Complete
        </div>

    </div>

    <script>
        /*
         * Birthday video list.
         *
         * This index.html and the assets folder
         * are at the same folder level.
         */

        const videos = [
            "assets/Caleb Birthday 1.mp4",
            "assets/Caleb Birthday 2.mp4",
            "assets/Caleb Birthday 3.mp4",
            "assets/Caleb Birthday 4.mp4",
            "assets/Caleb Birthday 5.mp4",
            "assets/Caleb Birthday 6.mp4",
            "assets/Caleb Birthday 7.mp4",
            "assets/Caleb Birthday 8.mp4"
        ];

        let currentVideo = 0;
        let clickStartTime = 0;

        const clickData = [];

        /* Page elements */

        const game =
            document.getElementById("game");

        const videoA =
            document.getElementById("videoA");

        const videoB =
            document.getElementById("videoB");

        const clickScreen =
            document.getElementById("clickScreen");

        const introScreen =
            document.getElementById("introScreen");

        const startScreen =
            document.getElementById("startScreen");

        const startButton =
            document.getElementById("startButton");

        const finishScreen =
            document.getElementById("finishScreen");

        /*
         * activeVideo is currently visible.
         * standbyVideo preloads the next scene.
         */

        let activeVideo = videoA;
        let standbyVideo = videoB;

        /* Load a video without displaying it */

        function preloadVideo(videoElement, videoIndex) {
            videoElement.pause();
            videoElement.style.opacity = "0";
            videoElement.style.zIndex = "1";

            if (videoIndex >= videos.length) {
                videoElement.removeAttribute("src");
                videoElement.load();
                return;
            }

            videoElement.src = videos[videoIndex];
            videoElement.preload = "auto";
            videoElement.load();
        }

        /*
         * Begin:
         *
         * 1. Display the introduction for five seconds.
         * 2. Load video 1.
         * 3. Preload video 2 in the background.
         */

        startButton.addEventListener("click", function () {
            startScreen.style.display = "none";
            finishScreen.style.display = "none";
            introScreen.style.display = "flex";

            currentVideo = 0;
            clickData.length = 0;

            activeVideo = videoA;
            standbyVideo = videoB;

            activeVideo.style.opacity = "1";
            activeVideo.style.zIndex = "2";

            standbyVideo.style.opacity = "0";
            standbyVideo.style.zIndex = "1";

            preloadVideo(activeVideo, 0);
            preloadVideo(standbyVideo, 1);

            /*
             * preloadVideo hides the element, so make
             * the first player visible again.
             */

            activeVideo.style.opacity = "1";
            activeVideo.style.zIndex = "2";

            /*
             * 5000 milliseconds = 5 seconds.
             */

            setTimeout(function () {
                introScreen.style.display = "none";
                playFirstVideo();
            }, 5000);
        });

        /* Play video 1 */

        function playFirstVideo() {
            activeVideo.currentTime = 0;

            activeVideo.play()
                .then(function () {
                    console.log(
                        "Playing video:",
                        currentVideo + 1,
                        videos[currentVideo]
                    );
                })
                .catch(function (error) {
                    showPlaybackError(error);
                });
        }

        /*
         * Switch to the already preloaded video.
         *
         * The old video's final frame remains visible
         * until the next video is actually playing.
         */

        function playPreloadedVideo() {
            const outgoingVideo = activeVideo;
            const incomingVideo = standbyVideo;

            let hasRevealedVideo = false;

            incomingVideo.currentTime = 0;

            function revealIncomingVideo() {
                if (hasRevealedVideo) {
                    return;
                }

                hasRevealedVideo = true;

                /*
                 * Fade the incoming scene over the final
                 * frame of the outgoing scene.
                 */

                incomingVideo.style.zIndex = "3";
                incomingVideo.style.opacity = "1";

                outgoingVideo.style.zIndex = "2";

                setTimeout(function () {
                    outgoingVideo.style.opacity = "0";
                    outgoingVideo.style.zIndex = "1";

                    activeVideo = incomingVideo;
                    standbyVideo = outgoingVideo;

                    /*
                     * The old player is now hidden, so it
                     * can preload the following video.
                     */

                    preloadVideo(
                        standbyVideo,
                        currentVideo + 1
                    );

                    activeVideo.style.opacity = "1";
                    activeVideo.style.zIndex = "2";
                }, 200);
            }

            /*
             * Do not remove the old frame until the browser
             * confirms the new video is playing.
             */

            incomingVideo.addEventListener(
                "playing",
                revealIncomingVideo,
                { once: true }
            );

            incomingVideo.play()
                .then(function () {
                    console.log(
                        "Playing video:",
                        currentVideo + 1,
                        videos[currentVideo]
                    );
                })
                .catch(function (error) {
                    incomingVideo.removeEventListener(
                        "playing",
                        revealIncomingVideo
                    );

                    showPlaybackError(error);
                });
        }

        /* Handle the end of both video players */

        function handleVideoEnded(event) {
            /*
             * Ignore an ended event from a hidden player.
             */

            if (event.currentTarget !== activeVideo) {
                return;
            }

            const isLastVideo =
                currentVideo === videos.length - 1;

            /*
             * Video 8 automatically finishes the study.
             */

            if (isLastVideo) {
                finishStudy();
                return;
            }

            /*
             * After videos 1–7, wait for the participant
             * to click anywhere.
             */

            clickStartTime = performance.now();
            clickScreen.style.display = "block";

            console.log(
                "Waiting for click after video:",
                currentVideo + 1
            );
        }

        videoA.addEventListener(
            "ended",
            handleVideoEnded
        );

        videoB.addEventListener(
            "ended",
            handleVideoEnded
        );

        /* Click anywhere to continue */

        clickScreen.addEventListener("click", function (event) {
            const reactionTime =
                performance.now() - clickStartTime;

            const gameRect =
                game.getBoundingClientRect();

            const clickX =
                event.clientX - gameRect.left;

            const clickY =
                event.clientY - gameRect.top;

            clickData.push({
                interaction: currentVideo + 1,
                video: videos[currentVideo],
                reactionTime: Math.round(reactionTime),
                clickX: Math.round(clickX),
                clickY: Math.round(clickY)
            });

            console.log(
                "Interaction:",
                currentVideo + 1,
                "Reaction time:",
                Math.round(reactionTime),
                "ms"
            );

            clickScreen.style.display = "none";

            currentVideo++;

            playPreloadedVideo();
        });

        /* Display a playback error */

        function showPlaybackError(error) {
            console.error(
                "Video playback error:",
                error
            );

            alert(
                "Could not play this video:\n" +
                videos[currentVideo]
            );
        }

        /* Automatically finish after video 8 */

        function finishStudy() {
            videoA.pause();
            videoB.pause();

            videoA.style.opacity = "0";
            videoB.style.opacity = "0";

            introScreen.style.display = "none";
            clickScreen.style.display = "none";
            finishScreen.style.display = "flex";

            console.log("BIRTHDAY STUDY COMPLETE");
            console.log("FINAL INTERACTION DATA:");

            console.table(clickData);
        }
    </script>
</body>
</html>
