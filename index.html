<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Caleb Birthday Study</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;
            font-family: Arial, sans-serif;
        }

        #game {
            position: relative;

            width: 430px;
            height: 760px;

            max-width: 100vw;
            max-height: 100vh;

            overflow: hidden;
            background: black;
        }

        /* Video */

        #storyVideo {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;
            background: black;
        }

        /* Begin screen */

        #startScreen {
            position: absolute;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            background: black;

            z-index: 30;
        }

        #startButton {
            padding: 15px 35px;

            border: none;
            border-radius: 30px;

            background: white;
            color: black;

            font-size: 18px;
            cursor: pointer;
        }

        #startButton:hover {
            background: #e8e8e8;
        }

        /* Five-second introduction */

        #introScreen {
            position: absolute;
            inset: 0;

            display: none;
            justify-content: center;
            align-items: center;

            padding: 40px;

            background: black;
            color: white;

            text-align: center;
            font-size: 20px;
            line-height: 1.6;

            z-index: 25;
        }

       #introScreen p {
    max-width: 350px;
    margin: 0;

    opacity: 0;

    animation:
        introFadeIn 1.5s ease-out 0.2s forwards;
}

@keyframes introFadeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
        /*
         * Transparent click area.
         * It is enabled only after videos 1–7 finish.
         */

        #clickScreen {
            position: absolute;
            inset: 0;

            display: none;

            background: transparent;
            cursor: pointer;

            z-index: 15;
        }

        /* Completion screen */

        #finishScreen {
            position: absolute;
            inset: 0;

            display: none;
            justify-content: center;
            align-items: center;

            background: black;
            color: white;

            font-size: 20px;
            text-align: center;

            z-index: 40;
        }
    </style>
</head>

<body>
    <div id="game">

        <video
            id="storyVideo"
            playsinline
            preload="auto">
        </video>

        <!-- Click anywhere to continue -->

        <div id="clickScreen"></div>

        <!-- Introduction shown for five seconds -->

        <div id="introScreen">
            <p>
                It’s Caleb’s birthday. After watching a movie
                together, you have prepared a small gift for him.
            </p>
        </div>

        <!-- Start screen -->

        <div id="startScreen">
            <button id="startButton" type="button">
                Begin
            </button>
        </div>

        <!-- Completion screen -->

        <div id="finishScreen">
            Story Complete
        </div>

    </div>

    <script>
        /*
         * Video filenames must exactly match the filenames
         * inside the assets folder.
         */

        const videos = [
            "assets/Caleb Birthday 1.mp4",
            "assets/Caleb Birthday 2.mp4",
            "assets/Caleb Birthday 3.mp4",
            "assets/Caleb Birthday 4-1.mp4",
            "assets/Caleb Birthday 5.mp4",
            "assets/Caleb Birthday 6-1.mp4",
            "assets/Caleb Birthday 7.mp4",
            "assets/Caleb Birthday 8.mp4"
        ];

        let currentVideo = 0;
        let clickStartTime = 0;

        const clickData = [];

        /* Page elements */

        const game =
            document.getElementById("game");

        const video =
            document.getElementById("storyVideo");

        const clickScreen =
            document.getElementById("clickScreen");

        const introScreen =
            document.getElementById("introScreen");

        const startScreen =
            document.getElementById("startScreen");

        const startButton =
            document.getElementById("startButton");

        const finishScreen =
            document.getElementById("finishScreen");

        /*
         * Begin:
         * 1. Hide the Begin screen.
         * 2. Show the introduction for five seconds.
         * 3. Automatically start video 1.
         */

        startButton.addEventListener("click", function () {
            startScreen.style.display = "none";
            finishScreen.style.display = "none";
            introScreen.style.display = "flex";

            currentVideo = 0;
            clickData.length = 0;

            /*
             * Load video 1 while the introduction
             * is being displayed.
             */

            video.src = videos[0];
            video.load();

            /*
             * 5000 milliseconds = 5 seconds.
             */

            setTimeout(function () {
                introScreen.style.display = "none";
                playCurrentVideo();
            }, 5000);
        });

        /* Play the current video */

        function playCurrentVideo() {
            clickScreen.style.display = "none";
            video.style.display = "block";

            video.src = videos[currentVideo];
            video.load();

            video.play()
                .then(function () {
                    console.log(
                        "Playing video:",
                        currentVideo + 1,
                        videos[currentVideo]
                    );
                })
                .catch(function (error) {
                    console.error(
                        "Video playback error:",
                        error
                    );

                    alert(
                        "Could not play this video:\n" +
                        videos[currentVideo]
                    );
                });
        }

        /* Handle the end of each video */

        video.addEventListener("ended", function () {
            const isLastVideo =
                currentVideo === videos.length - 1;

            /*
             * Video 8 ends the game automatically.
             * The participant does not need to click again.
             */

            if (isLastVideo) {
                finishStudy();
                return;
            }

            /*
             * After videos 1–7, enable the transparent
             * click area and start measuring reaction time.
             */

            clickStartTime = performance.now();
            clickScreen.style.display = "block";

            console.log(
                "Waiting for click after video:",
                currentVideo + 1
            );
        });

        /* Click anywhere to continue */

        clickScreen.addEventListener("click", function (event) {
            const reactionTime =
                performance.now() - clickStartTime;

            const gameRect =
                game.getBoundingClientRect();

            const clickX =
                event.clientX - gameRect.left;

            const clickY =
                event.clientY - gameRect.top;

            /*
             * Save interaction information.
             */

            clickData.push({
                interaction: currentVideo + 1,
                video: videos[currentVideo],
                reactionTime: Math.round(reactionTime),
                clickX: Math.round(clickX),
                clickY: Math.round(clickY)
            });

            console.log(
                "Interaction:",
                currentVideo + 1,
                "Reaction time:",
                Math.round(reactionTime),
                "ms"
            );

            clickScreen.style.display = "none";

            currentVideo++;

            playCurrentVideo();
        });

        /* Automatically finish after video 8 */

        function finishStudy() {
            video.pause();
            video.style.display = "none";

            introScreen.style.display = "none";
            clickScreen.style.display = "none";
            finishScreen.style.display = "flex";

            console.log("STUDY COMPLETE");
            console.log("FINAL INTERACTION DATA:");

            console.table(clickData);
        }
    </script>
</body>
</html>
